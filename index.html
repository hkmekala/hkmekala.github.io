  <body class="mode-intro">
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Harikrishna Mekala, Senior Software Engineer. This site needs JavaScript. You can reach me at me@hkmekala.me or
        find me on <a href="https://www.linkedin.com/in/hkmekala">LinkedIn</a> and
        <a href="https://www.github.com/hkmekala">GitHub</a>.
      </p>
    </noscript>

    <canvas id="world" aria-hidden="true"></canvas>

    <!-- Intro / loading screen -->
    <section id="intro" aria-label="Welcome">
      <div class="intro-glow" aria-hidden="true"></div>
      <div class="intro-inner">
        <img class="intro-mascot" src="/mascot.jpg" alt="A panda riding a small teal hover pod" width="220" height="220" />
        <p class="eyebrow">Hi, there! I'm</p>
        <h1 id="intro-name" aria-label="Harikrishna Mekala"></h1>
        <p class="intro-role">Senior Software Engineer. Backend systems, cloud infrastructure and AI platforms.</p>
        <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
        <div class="intro-actions">
          <button id="enter-world" class="btn btn-primary" disabled>Loading world…</button>
          <button id="enter-plain" class="btn btn-ghost">Quick résumé view</button>
        </div>
        <p class="intro-note" id="intro-note">Drive a panda through seven years of work. Takes about two minutes.</p>
      </div>
    </section>

    <!-- In-world interface -->
    <div id="hud" hidden>
      <header class="hud-top">
        <div class="brand">
          <img src="/mascot.jpg" alt="" width="40" height="40" />
          <div>
            <strong>Harikrishna Mekala</strong>
            <span>Senior Software Engineer</span>
          </div>
        </div>
        <nav id="journey" aria-label="Jump to a career stop"></nav>
        <div class="hud-actions">
          <span id="token-count" title="Tech collected">0</span>
          <button id="to-plain" class="btn btn-small">Résumé view</button>
        </div>
      </header>
      <aside id="card" aria-live="polite"></aside>
      <p id="hint"></p>
      <div id="toast" role="status"></div>
      <div id="stick" aria-hidden="true"><div id="knob"></div></div>
      <button id="jump" aria-label="Jump">Jump</button>
    </div>

    <!-- Plain résumé view (filled in by src/plain/plain.ts) -->
    <main id="plain" hidden></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
